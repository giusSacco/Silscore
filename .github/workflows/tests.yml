name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install . pytest
      - name: Test
        run: |
          python -m pytest -q
          python -I -c "from silscore import load_default_model; load_default_model()"
